<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Plantation Quality Map</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html,body{
    margin:0;
    padding:0;
    height:100%;
}

#map{
    width:100%;
    height:100vh;
}

.popup-table{
    border-collapse:collapse;
    width:100%;
}

.popup-table td{
    border:1px solid #ddd;
    padding:4px 6px;
    font-size:12px;
    vertical-align:top;
}

.legend{
    background:white;
    padding:10px;
    border-radius:8px;
    box-shadow:0 0 8px rgba(0,0,0,.25);
    line-height:22px;
    font-size:13px;
}
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map');

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    attribution:'© OpenStreetMap'
}
).addTo(map);


// =====================
// LEGEND
// =====================

const legend = L.control({position:'bottomright'});

legend.onAdd = function(){

    const div = L.DomUtil.create('div','legend');

    div.innerHTML = `
    <b>Plantation Quality</b><br>
    🟩 Good / Tốt<br>
    🟨 Fair / Trung bình<br>
    🟥 Poor / Kém<br>
    🟦 New Plantation / Trồng mới
    `;

    return div;
};

legend.addTo(map);


// =====================
// POPUP
// =====================

function createPopup(properties){

    let html = `
    <div style="
        max-height:350px;
        overflow-y:auto;
        overflow-x:hidden;
    ">
    <table class="popup-table">
    `;

    Object.entries(properties).forEach(([key,value])=>{

        if(value !== null && value !== ''){

            html += `
            <tr>
                <td><b>${key}</b></td>
                <td>${value}</td>
            </tr>
            `;
        }
    });

    html += `
    </table>
    </div>
    `;

    return html;
}


// =====================
// COLOR
// =====================

function getQualityColor(feature){

    const props = feature.properties;

    const quality =
        props["Chất lượng vườn (Plantation Quality)"] ||
        props["Plantation Quality"] ||
        props["CHAT_LUONG_VUON"] ||
        props["CL_VUON"] ||
        '';

    if(
        quality.includes('Tốt') ||
        quality.includes('Good')
    ){
        return '#00c853';
    }

    if(
        quality.includes('Trung bình') ||
        quality.includes('Fair') ||
        quality === 'TB'
    ){
        return '#ffd600';
    }

    if(
        quality.includes('Kém') ||
        quality.includes('Poor')
    ){
        return '#ff5252';
    }

    if(
        quality.includes('Trồng mới') ||
        quality.includes('New') ||
        quality === 'TM'
    ){
        return '#2196f3';
    }

    return '#bdbdbd';
}


// =====================
// LOAD GEOJSON
// =====================

fetch('Thua.geojson')
.then(r => r.json())
.then(data => {

    const layer = L.geoJSON(data,{

        style: feature => ({
            color:'#666',
            weight:1,
            fillColor:getQualityColor(feature),
            fillOpacity:0.75
        }),

        onEachFeature:(feature,layer)=>{

            layer.bindPopup(
                createPopup(feature.properties)
            );

        }

    }).addTo(map);

    map.fitBounds(layer.getBounds());

})
.catch(err => {

    console.error(err);

    alert(
        'Không tìm thấy file Thua.geojson'
    );

});

</script>

</body>
</html>
